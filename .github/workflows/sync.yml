name: Config Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python3
      uses: actions/setup-python@v2
      with:
        python-version: 3.x
    - name: Convert repository Surge rule-sets to sing-box
      run: |
        python -m unittest discover -s singbox -p 'test_convert_surge.py' -v
        python singbox/convert_surge.py
    - name: Commit and push generated rule-sets
      run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"
        git add ./singbox/surge/*.json

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update native Surge rule sets"
          git push
        fi
